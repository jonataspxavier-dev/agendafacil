spring:
  application:
    name: AgendaFacilBackend
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:agendafacil}
    username: ${DB_USER:agendafacil}
    password: ${DB_PASSWORD:agendafacil}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-in-production-0123456789abcdef}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
